spring.application.name=rag-app

# ===== Ollama (로컬 무료 LLM) 연결 설정 =====
spring.ai.ollama.base-url=http://localhost:11434

# 답변 생성용 모델 (Gemma 3)
spring.ai.ollama.chat.options.model=gemma3
spring.ai.ollama.chat.options.temperature=0.2

# 임베딩(벡터 변환)용 모델
spring.ai.ollama.embedding.options.model=nomic-embed-text

# 앱 시작 시 모델을 자동으로 내려받지 않음 (미리 ollama pull 로 받아둠)
spring.ai.ollama.init.pull-model-strategy=never

# ===== Chroma 벡터 저장소 (영구 저장) =====
# 별도로 띄운 Chroma 서버 주소 (docker run -p 8000:8000 chromadb/chroma)
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
# Chroma v2 API의 격리 단위 (기본값)
spring.ai.vectorstore.chroma.tenant-name=default_tenant
spring.ai.vectorstore.chroma.database-name=default_database
# 벡터를 담을 컬렉션(테이블 같은 개념) 이름
spring.ai.vectorstore.chroma.collection-name=rag_docs
# 컬렉션이 없으면 앱 시작 시 자동 생성
spring.ai.vectorstore.chroma.initialize-schema=true

# ===== 파일 업로드 용량 제한 =====
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
